org.gradle.jvmargs=-Xmx4G
android.useAndroidX=true
android.nonTransitiveR.class=true

# Disable Kotlin incremental compilation — fixes cross-drive path crashes
# when pub cache (C:\) and project (D:\) are on different drives.
kotlin.incremental=false

# R8 full mode — more aggressive tree-shaking, removes more dead code
# than default mode. Saves ~1-3MB on release builds.
android.enableR8.fullMode=true
