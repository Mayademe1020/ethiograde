plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

android {
    namespace "com.ethiograde"
    compileSdk 36

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = '11'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        applicationId "com.ethiograde"
        minSdk 26
        targetSdk 36
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
        multiDexEnabled true
        ndkVersion "28.2.13676358"
        // arm64 only — saves ~50MB by dropping x86 + armv7 ABIs.
        // 95%+ of Ethiopian Android 8+ phones are arm64.
        ndk {
            abiFilters 'arm64-v8a'
        }
        // Strip unused language resources from native libs.
        // App handles i18n itself (Amharic/English) — no need for
        // Android's built-in locale resources. Saves ~1-3MB.
        resourceConfigurations += ['en']
    }

    buildTypes {
        release {
            signingConfig signingConfigs.debug
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Strip native debug symbols from release APK.
            // Saves ~1-2MB. Debug symbols are in split-debug-info/.
            ndk {
                debugSymbolLevel 'NONE'
            }
        }
    }
}

flutter {
    source '../..'
}

// Workaround: Flutter 3.41.6 + AGP 8.9.1 (declarative plugin syntax)
// causes Flutter's output path detection to fail. The APK is built at
// android/app/build/outputs/flutter-apk/ but Flutter looks for it at
// <project_root>/build/app/outputs/flutter-apk/.
// Copy it there after each build so `flutter build apk` succeeds.
afterEvaluate {
    def flutterApkDir = file("${rootProject.projectDir}/../build/app/outputs/flutter-apk")
    def androidApkDir = file("${buildDir}/outputs/flutter-apk")

    tasks.matching { it.name == 'assembleDebug' }.all { task ->
        task.doLast {
            flutterApkDir.mkdirs()
            def srcApk = file("${androidApkDir}/app-debug.apk")
            if (srcApk.exists()) {
                def dstApk = file("${flutterApkDir}/app-debug.apk")
                dstApk.bytes = srcApk.bytes
                println("[EthioGrade] APK copied to: ${dstApk}")
            }
        }
    }
}

// AndroidX dependencies are provided transitively by Flutter plugins.
