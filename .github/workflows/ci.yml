name: Android CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Run Unit Tests
        run: gradle :app:testDebugUnitTest --no-daemon

      - name: Build Debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Measure Debug APK Size
        run: |
          APK_PATH=app/build/outputs/apk/debug/app-debug.apk
          APK_SIZE=$(stat -c%s "$APK_PATH")
          APK_SIZE_MB=$(awk "BEGIN {printf \"%.1f\", $APK_SIZE / 1048576}")
          echo "Debug APK: ${APK_SIZE_MB}MB (${APK_SIZE} bytes)"
          echo "## Build Metrics" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Debug APK Size | ${APK_SIZE_MB}MB |" >> $GITHUB_STEP_SUMMARY

      - uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
