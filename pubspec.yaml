name: ethiograde
description: AI-powered offline grading tool for Ethiopian teachers (Grades 1-12 & Universities).
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.8.0 <4.0.0'
  flutter: '>=3.41.6'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  provider: ^6.1.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Crypto (SHA-256 for answer-key fingerprinting)
  crypto: ^3.0.3

  # Camera & Image
  camera: ^0.10.5+9
  image: ^4.1.3
  image_picker: ^1.1.2
  path_provider: ^2.1.2

  # PDF & CSV
  pdf: ^3.10.7
  csv: ^6.0.0
  file_picker: ^8.0.0+1

  # Voice (TTS only — STT/record/playback deferred to v0.3.0)
  flutter_tts: ^4.2.5
  # speech_to_text: ^7.3.0
  # record: ^6.2.0
  # just_audio: ^0.9.36

  # ML
  google_mlkit_text_recognition: ^0.15.1
  # google_mlkit_commons is transitive — don't pin it directly

  # Network (optional cloud OCR — not used in offline mode)
  http: ^1.2.2

  # Security
  flutter_secure_storage: ^9.0.0
  encrypt: ^5.0.3

  # UI & Utilities
  share_plus: ^7.2.1
  uuid: ^4.2.2
  shared_preferences: ^2.2.2
  google_fonts: ^8.1.0
  telephony: ^0.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  hive_generator: ^2.0.1
  build_runner: ^2.4.8
  path_provider_platform_interface: ^2.0.0

  camera_platform_interface: any
flutter:
  uses-material-design: true
  assets:
    - assets/fonts/
  fonts:
    - family: Plus Jakarta Sans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-Italic.ttf
          style: italic
        - asset: assets/fonts/PlusJakartaSans-BoldItalic.ttf
          weight: 700
          style: italic
